<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            background: #413b3b;
        }
        .container {
            background: #66637b;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }
        img {
            max-width: 300px;
            height: auto;
            display: block;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 3px solid #ddd;
        }
        button {
            padding: 10px 20px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            
        }
        button:hover {
            background: #095a91;
        }
    </style>
</head>
<body>

    <div class="container">
        <img id="myImg" src="img1.jpg" alt="Первая картинка">
        <button id="Button">Сменить картинку</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
