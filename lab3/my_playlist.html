<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои любимые треки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: navy;
            color: #1a1edd;                
            padding: 20px;                
        }
        h1 {
            text-align: center;            
            color: #000007;              
        }
        .card {
            background-color: #a09393;     
            border: 1px solid #cccccc;     
            padding: 15px;               
            margin-bottom: 15px;         
            border-radius: 10px;     
        }
        .picture {
            width: 100px;               
            height: 100px;                
            object-fit: cover;             
        }
        .link {
            font-size: 20px;              
            font-weight: bold;            
            color: #7c0172;                
            transition: color 0.3s;       
        }
        .link:hover {
            text-decoration: underline; 
            color: #6c54af;                
        }
        .artist {
            color: #000000;               
            font-size: 15px;              
        }
    </style>
</head>
<body>

    <h1>Мой плейлист</h1>
    <div class="card">
        <img src="1.jpg" alt="Обложка трека Дождь" class="picture">
        <p>
            <a href="https://www.youtube.com/watch?v=0vVpH-6BOKA&list=RD0vVpH-6BOKA&start_radio=1&pp=ygUMdmZyY2J2IGxqO2xtoAcB" target="_blank" class="link">Дождь МакSим</a>
        </p>
        <p class="artist">Исполнитель: МакSим</p>
    </div>
    <div class="card">
        <img src="2.jpg" alt="Обложка трека Дотянуться до солнца" class="picture">
        <p>
            <a href="https://www.youtube.com/watch?v=Nwl-vtix29c&list=RDNwl-vtix29c&start_radio=1" target="_blank" class="link">Дотянуться до солнца Monokini</a>
        </p>
        <p class="artist">Исполнитель: Monokini</p>
    </div>
    <div class="card">
        <img src="3.jpg" alt="Обложка трека Время" class="picture">
        <p>
            <a href="https://www.youtube.com/watch?v=UGqJ4HOzqzA&list=RDUGqJ4HOzqzA&start_radio=1" target="_blank" class="link">Время</a>
        </p>
        <p class="artist">Исполнитель: 2Hug</p>
    </div>
</body>
</html>
