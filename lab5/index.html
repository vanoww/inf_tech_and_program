<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="form">
    <h1 class="form__title">Регистрация</h1>
    <div class="form__group">
      <label class="form__label" for="name">Имя:</label>
      <input class="form__input" type="text" id="name" required aria-required="true">
    </div>
    <div class="form__group">
      <label class="form__label" for="email">Почта:</label>
      <input class="form__input" type="email" id="email" required aria-required="true">
    </div>
    <div class="form__group">
      <label class="form__label" for="pass">Пароль:</label>
      <input class="form__input" type="password" id="pass" required aria-required="true">
    </div>
    <div class="form__group">
      <label class="form__label" for="phone">Телефон:</label>
      <input class="form__input" type="tel" id="phone">
    </div>
    <fieldset class="form__fieldset">
      <legend class="form__legend">Роль:</legend>
      <label class="form__radio-label">
        <input class="form__radio" type="radio" name="role" value="1" checked> Студент
      </label>
      <label class="form__radio-label">
        <input class="form__radio" type="radio" name="role" value="2"> Преподаватель
      </label>
    </fieldset>
    <div class="form__group">
      <label class="form__label" for="range">Уровень знаний (1-10):</label>
      <input class="form__input" type="range" id="range" min="1" max="10">
    </div>
    <div class="form__checkbox-group">
      <label class="form__checkbox-label">
        <input class="form__checkbox" type="checkbox" required aria-required="true"> 
        Согласен на обработку данных
      </label>
    </div>
    <button class="button button--submit" type="submit">Отправить</button>
  </form>
</body>
</html>
